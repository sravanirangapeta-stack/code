<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      :root {
        --bg1: #0f172a;
        --bg2: #111827;
        --card: rgba(15, 23, 42, 0.8);
        --primary: #8b5cf6;
        --primary-dark: #7c3aed;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --border: rgba(148, 163, 184, 0.2);
        --input: rgba(15, 23, 42, 0.65);
        --success: #22c55e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg1), var(--bg2));
        color: var(--text);
      }

      .login-container {
        width: min(92vw, 420px);
        background: var(--card);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 32px 28px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      }

      .brand {
        text-align: center;
        margin-bottom: 24px;
      }

      .logo {
        width: 60px;
        height: 60px;
        margin: 0 auto 12px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: linear-gradient(135deg, var(--primary), #06b6d4);
        font-size: 1.6rem;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: 2rem;
      }

      .subtitle {
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.95rem;
        text-align: center;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 18px;
        margin-top: 28px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-size: 0.9rem;
        color: var(--muted);
      }

      input {
        width: 100%;
        border: 1px solid var(--border);
        background: var(--input);
        color: var(--text);
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus {
        border-color: rgba(139, 92, 246, 0.8);
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.18);
      }

      .remember-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .remember {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .remember input {
        width: auto;
        accent-color: var(--primary);
      }

      .forgot {
        color: #c4b5fd;
        text-decoration: none;
      }

      .primary-btn {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        border: none;
        border-radius: 12px;
        color: white;
        padding: 14px 18px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      .primary-btn:hover {
        transform: translateY(-1px);
        opacity: 0.97;
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        margin: 8px 0;
      }

      .divider::before,
      .divider::after {
        content: "";
        height: 1px;
        flex: 1;
        background: var(--border);
      }

      .secondary-btn {
        width: 100%;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text);
        padding: 12px 16px;
        font-size: 1rem;
        cursor: pointer;
      }

      .signup {
        margin-top: 18px;
        text-align: center;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .signup a {
        color: #c4b5fd;
        text-decoration: none;
        font-weight: 600;
      }

      @media (max-width: 480px) {
        .login-container {
          padding: 24px 20px;
        }

        h1 {
          font-size: 1.7rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="brand">
        <div class="logo">L</div>
        <h1>Welcome back</h1>
        <div class="subtitle">Sign in to continue</div>
      </div>

      <form>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" />
        </div>

        <div class="remember-row">
          <label class="remember">
            <input type="checkbox" />
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot">Forgot password?</a>
        </div>

        <button type="submit" class="primary-btn">Sign In</button>

        <div class="divider">or</div>

        <button type="button" class="secondary-btn">Continue with Google</button>
      </form>

      <div class="signup">
        Don’t have an account? <a href="#">Sign up</a>
      </div>
    </div>
  </body>
</html>
